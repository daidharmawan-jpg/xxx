
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Beyond the Surface</title>

  <style>
    /* RESET */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --text-color: #ffffff;
      --button-bg: #ffffff;
      --button-color: #111111;
      --overlay-color: rgba(0, 0, 0, 0.43);
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      color: var(--text-color);
    }

    body {
      overflow-x: hidden;
    }

    /* HERO */
    .hero {
      position: relative;
      width: 100%;
      min-height: 100svh;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      isolation: isolate;
      overflow: hidden;
      background: #242424;
    }

    /* VIDEO BACKGROUND */
    .background-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: -2;
    }

    /* OVERLAY */
    .overlay {
      position: absolute;
      inset: 0;
      background: var(--overlay-color);
      z-index: -1;
    }

    /* MAIN CONTENT */
    .content {
      width: 100%;
      max-width: 760px;
      padding: 32px 24px;
      text-align: center;
      animation: fadeIn 1s ease-out;
    }

    .title {
      font-size: clamp(36px, 5vw, 58px);
      font-weight: 400;
      line-height: 1.12;
      letter-spacing: -1px;
      text-transform: uppercase;
      margin-bottom: 44px;
      text-wrap: balance;
    }

    .description {
      max-width: 650px;
      margin: 0 auto 54px;
      font-size: clamp(17px, 2.3vw, 28px);
      font-weight: 400;
      line-height: 1.3;
      color: rgba(255, 255, 255, 0.95);
      text-wrap: balance;
    }

    /* BUTTON */
    .cta-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: min(100%, 360px);
      min-height: 78px;
      margin: 0 auto;
      padding: 18px 24px;
      border: 0;
      border-radius: 9px;
      background: var(--button-bg);
      color: var(--button-color);
      font-size: clamp(20px, 2.4vw, 27px);
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.2s ease,
                  background 0.2s ease;
    }

    .cta-button:hover {
      transform: translateY(-3px);
      background: #eeeeee;
    }

    .cta-button:active {
      transform: scale(0.98);
    }

    /* VIDEO STATUS */
    .status {
      position: absolute;
      top: 24px;
      right: 24px;
      padding: 9px 13px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 30px;
      background: rgba(0, 0, 0, 0.25);
      color: #fff;
      font-size: 12px;
      backdrop-filter: blur(8px);
    }

    .status-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 6px;
      border-radius: 50%;
      background: #71e5a0;
    }

    /* MOBILE */
    @media (max-width: 600px) {
      .hero {
        min-height: 100vh;
        min-height: 100svh;
      }

      .background-video {
        object-position: center center;
      }

      .overlay {
        background: rgba(0, 0, 0, 0.43);
      }

      .content {
        padding: 24px 22px;
        transform: translateY(10px);
      }

      .title {
        max-width: 420px;
        margin: 0 auto 48px;
        font-size: clamp(34px, 9vw, 44px);
        line-height: 1.16;
        letter-spacing: -0.8px;
      }

      .description {
        margin-bottom: 55px;
        font-size: clamp(17px, 5vw, 23px);
        line-height: 1.3;
      }

      .cta-button {
        width: min(100%, 360px);
        min-height: 78px;
        font-size: 24px;
        border-radius: 9px;
      }

      .status {
        top: 15px;
        right: 15px;
      }
    }

    /* DESKTOP */
    @media (min-width: 900px) {
      .content {
        max-width: 900px;
      }

      .title {
        margin-bottom: 35px;
      }

      .description {
        margin-bottom: 40px;
      }

      .cta-button {
        min-height: 72px;
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <main class="hero">

    <!-- VIDEO BACKGROUND -->
    <video
      id="backgroundVideo"
      class="background-video"
      autoplay
      muted
      loop
      playsinline
      preload="metadata"
      poster="poster.jpg"
      aria-hidden="true"
    >
      <source src="background.mp4" type="video/mp4">
    </video>

    <!-- OVERLAY -->
    <div class="overlay"></div>

    <!-- STATUS -->
    <div class="status">
      <span class="status-dot"></span>
      <span id="videoStatus">CONNECTED</span>
    </div>

    <!-- CONTENT -->
    <section class="content">

      <h1 class="title">
        Beyond the<br>
        Surface
      </h1>

      <p class="description">
        Some things are better kept away from
        the public eye. Step closer and discover
        what lies beyond.
      </p>

      <!-- GANTI LINK DI BAGIAN href -->
      <a
        class="cta-button"
        id="mainButton"
        href="https://t.me/username_anda"
        target="_blank"
        rel="noopener noreferrer"
      >
        [CONNECTED]
      </a>

    </section>

  </main>

  <script>
    /*
      =====================================
      PENGATURAN LANDING PAGE
      =====================================

      1. Ganti URL video pada videoSources.
      2. Ganti link Telegram pada telegramLink.
      3. Ubah judul dan deskripsi sesuai kebutuhan.
    */

    const settings = {
      videoSources: [
        "background.mp4"
      ],

      telegramLink: "https://t.me/username_anda",

      buttonText: "[CONNECTED]",

      title: "Beyond the Surface",

      description:
        "Some things are better kept away from the public eye. Step closer and discover what lies beyond."
    };

    const video = document.getElementById("backgroundVideo");
    const button = document.getElementById("mainButton");
    const title = document.querySelector(".title");
    const description = document.querySelector(".description");
    const videoStatus = document.getElementById("videoStatus");

    // Terapkan pengaturan teks.
    title.textContent = settings.title;
    description.textContent = settings.description;

    // Pertahankan format dua baris judul.
    title.innerHTML = settings.title
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/\n/g, "<br>");

    button.textContent = settings.buttonText;
    button.href = settings.telegramLink;

    // Memuat video pertama.
    function loadVideo(source) {
      videoStatus.textContent = "LOADING";

      video.src = source;
      video.load();

      video.play()
        .then(() => {
          videoStatus.textContent = "CONNECTED";
        })
        .catch(() => {
          videoStatus.textContent = "READY";
        });
    }

    // Jika video gagal dimuat.
    video.addEventListener("error", () => {
      videoStatus.textContent = "VIDEO UNAVAILABLE";
    });

    // Memuat video dari pengaturan.
    if (settings.videoSources.length > 0) {
      loadVideo(settings.videoSources[0]);
    }
  </script>

</body>
</html>
